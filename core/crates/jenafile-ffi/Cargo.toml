[package]
name = "jenafile-ffi"
description = "UniFFI layer exposing jenafile-core to Swift (and later other UIs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "jenafile_ffi"
# staticlib → xcframework for SwiftPM; cdylib so uniffi-bindgen can read metadata
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

[dependencies]
jenafile-core = { path = "../jenafile-core" }
uniffi = { version = "0.32.2", features = ["tokio", "cli"] }
